<title>CSS text properties example</title>
<style>
p
{
	text-align:center;
	font-weight:bold;
	font-size:20px;
	text-decoration:underline;
	line-height:1.5;
	letter-spacing:2px;
	font-family:"times new roman", Times, serif;
	
}
</style>
</head>
<body>
