<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub User Fetcher</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    .container {
      width: 320px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      box-sizing: border-box;
    }

    img {
      width: 100px;
      border-radius: 50%;
      margin-top: 10px;
    }

    p {
      margin: 5px 0;
      font-size: 14px;
    }

    /* Profile Link Button Style */
    .profile-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #0366d6;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
    }

    .profile-link:hover {
      background-color: #024ea4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>GitHub User Fetcher</h2>
    <input type="text" id="username" placeholder="Enter GitHub Username">
    <button onclick="getGitHubData()">Fetch Data</button>

    <div id="result"></div>
  </div>

  <script>
    async function getGitHubData() {
      const username = document.getElementById('username').value;
      const resultDiv = document.getElementById('result');

      if (!username) {
        resultDiv.innerHTML = "<p>Please enter username!</p>";
        return;
      }

      try {
        const response = await fetch(`https://api.github.com/users/${username}`);
        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `
            <img src="${data.avatar_url}" alt="Profile Image">
            <h3>${data.name || data.login}</h3>
            <p><strong>Followers:</strong> ${data.followers}</p>
            <p><strong>Location:</strong> ${data.location || 'Not Provided'}</p>
            <p><strong>Email:</strong> ${data.email || 'Not Public'}</p>
            <a href="${data.html_url}" target="_blank" class="profile-link">View GitHub Profile</a>
          `;
        } else {
          resultDiv.innerHTML = "<p>User Not Found!</p>";
        }
      } catch (error) {
        resultDiv.innerHTML = "<p>Error loading data!</p>";
      }
    }
  </script>

</body>
</html>
