<html>
<head>
<title>CSS ID Selector Example</title>
<style>
#my-paragraph
{
	text-align:center;
	font-weight:bold;
	font-size:20px;
	text-decoration:underline;
	line-height:1.5;
	letter-spacing:2px;
	font-family:"times new roman", Times, serif;
	color: green;
}
</style>
</head>
<body>
	<p id="my-paragraph">This paragraph is styled using an ID selector.</p>
</body>
</html>
